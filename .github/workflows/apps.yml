# Builds the packaged apps on demand (Actions → Apps → Run workflow).
# Unsigned check builds: a debug APK, an iOS simulator build, a Windows folder.
# Store signing is described in docs/deploy-stores.md.
name: Apps
on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npx -y pnpm@9.15.0 install --frozen-lockfile
      - run: npx -y pnpm@9.15.0 --filter @hanoi-monopoly/mobile run sync
      - run: ./gradlew assembleDebug
        working-directory: packages/mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: packages/mobile/android/app/build/outputs/apk/debug/*.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npx -y pnpm@9.15.0 install --frozen-lockfile
      - run: npx -y pnpm@9.15.0 --filter @hanoi-monopoly/mobile run sync
      - run: xcodebuild -project App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
        working-directory: packages/mobile/ios/App

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npx -y pnpm@9.15.0 install --frozen-lockfile
      - run: npx -y pnpm@9.15.0 --filter @hanoi-monopoly/desktop run dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows-unpacked
          path: packages/desktop/release/win-unpacked
